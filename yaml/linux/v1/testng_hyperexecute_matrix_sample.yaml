---
version: 0.1
runson: ${matrix.os}

matrix:
  tests: ["Test_1"]
  browser: ["Chrome"]
  version: ["latest"]
  os: ["linux"]

pre:
  - echo ${abc}
  - echo ${mygate}
  - mvn dependency:resolve

testSuites:
  - mvn test -Dplatname=linux -Dmaven.repo.local=m2_cache_dir -DselectedTests=$tests

parallelism: 1
report: true
partialReports:
  location: target/
  type: html
  frameworkName: extent
  email:
    to: 
      - ${email}

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, linux, matrix]
